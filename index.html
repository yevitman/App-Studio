<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>App Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">A</div><div class="brand-text"><div class="brand-name">App Studio</div><div class="brand-sub">AI App Builder</div></div></div>
      <nav class="nav" aria-label="메인 메뉴">
        <button class="nav-btn active" data-panel="create">✦ 생성</button>
        <button class="nav-btn" data-panel="preview">◫ 미리보기</button>
        <button class="nav-btn" data-panel="versions">⟲ 버전</button>
      </nav>
      <button class="btn ghost settings-button" id="open-settings">⚙ AI 연결 설정</button>
    </aside>
    <main class="main">
      <section class="panel active" id="create">
        <div class="row head-row"><div><div class="eyebrow">생성</div><h1>앱 만들기</h1></div><button class="btn primary" id="make-prompt">프롬프트 만들기</button></div>
        <textarea id="request" class="request" placeholder="만들 앱을 설명하세요. 예: 반려동물 병원 예약과 진료 기록을 관리하는 앱"></textarea>
        <div class="card"><div class="card-head"><span>이번 앱 요청 프롬프트</span><button class="btn primary" id="approve" disabled>AI 앱 생성</button></div><div id="prompt" class="prompt empty">현재 입력한 앱 설명으로 프롬프트를 만듭니다.</div></div>
        <div id="status" class="status" aria-live="polite"></div>
      </section>
      <section class="panel" id="preview">
        <div class="row head-row"><div><div class="eyebrow">미리보기</div><h1>결과</h1></div><div class="inline-actions"><label class="btn ghost upload-box">+ 이미지<input id="image" type="file" accept="image/*"></label><button class="btn ghost" id="capture">캡처</button></div></div>
        <div id="app-preview" class="preview-box"><div class="empty-preview">AI로 앱을 생성하면 여기에 표시됩니다.</div></div>
        <div class="card modify-card"><div id="attachment" class="attachment hidden"></div><div class="modifier-row"><textarea id="change" rows="2" placeholder="수정 내용��� 입력하세요. 예: 상단에 검색창을 추가하고 버튼 색상을 파란색으로 변경"></textarea><div class="modifier-actions"><button class="btn ghost" id="clear">초기화</button><button class="btn primary" id="send-change">AI 수정 적용</button></div></div></div>
      </section>
      <section class="panel" id="versions"><div class="row head-row"><div><div class="eyebrow">기록</div><h1>버전</h1></div></div><div id="version-list" class="version-list"></div></section>
    </main>
  </div>
  <dialog id="confirm-dialog"><div class="dialog-box"><div class="eyebrow">요청 확인</div><h2>이 설명으로 AI 앱을 만들까요?</h2><pre id="dialog-prompt"></pre><div class="dialog-actions"><button class="btn ghost" id="cancel">취소</button><button class="btn primary" id="confirm">생성</button></div></div></dialog>
  <dialog id="settings-dialog"><div class="dialog-box"><div class="eyebrow">AI 연결</div><h2>서버 설정</h2><p class="settings-help">Vercel에 배포한 서버의 주소와 서버 접근 토큰을 입력하세요. OpenAI API 키는 이 화면에 넣지 말고 Vercel 환경 변수에만 저장해야 합니다.</p><label for="endpoint">AI 서버 주소</label><input id="endpoint" type="url" placeholder="https://your-project.vercel.app/api/edit"><label for="access-token">서버 접근 토큰</label><input id="access-token" type="password" autocomplete="off" placeholder="Vercel APP_ACCESS_TOKEN"><div class="dialog-actions"><button class="btn ghost" id="close-settings">취소</button><button class="btn primary" id="save-settings">저장</button></div></div></dialog>
</body>
</html>
