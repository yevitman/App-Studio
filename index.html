<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>App-Studio</title>
<style>
:root{--bg:#f4f6fb;--paper:#fff;--ink:#172033;--muted:#667085;--line:#e2e8f0;--brand:#4f46e5;--soft:#eef2ff;--pink:#db2777;--green:#059669;--shadow:0 6px 20px #17203312}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{height:100dvh;height:100svh;width:min(100%,620px);margin:auto;padding:10px 12px calc(72px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;overflow:hidden}.top{flex:none;padding:12px 15px;border-radius:16px;background:linear-gradient(130deg,#4f46e5,#9333ea);color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}.top strong{font-size:17px}.badge{font-size:11px;background:#ffffff30;padding:4px 8px;border-radius:20px}.status{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}.status span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}.version{color:var(--brand);background:var(--soft);border-radius:7px;padding:3px 7px;font-size:12px;font-weight:800}.view{display:none;flex:1;min-height:0;overflow:hidden}.view.active{display:flex}.panel{flex:1;min-height:0;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}.panel-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-head h2{margin:0;font-size:16px}.field{width:100%;border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:12px;color:var(--ink);outline:none;resize:none}.field:focus{border-color:var(--brand);background:white}.create-input{flex:1;min-height:90px}.edit-input{height:64px;flex:none}.btn{min-height:42px;padding:9px 12px;border-radius:11px;background:#f1f5f9;color:#334155;font-weight:750;white-space:nowrap}.btn.primary{background:var(--brand);color:white}.btn.pink{background:var(--pink);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.outline{background:#fff;border:1px solid var(--line)}.btn.small{min-height:34px;padding:6px 9px;font-size:12px}.btn.full{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview{flex:1;min-height:80px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}.attachment{display:none;position:relative;width:max-content;max-width:100%;border:1px solid var(--line);border-radius:9px;overflow:hidden}.attachment.show{display:block}.attachment img{display:block;max-height:62px;max-width:100%}.remove{position:absolute;right:4px;top:4px;border-radius:50%;background:#172033c9;color:#fff;width:23px;height:23px}.list{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:7px}.item{flex:none;border:1px solid var(--line);border-radius:11px;background:#fafbff;padding:9px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.item.active{background:var(--soft);border-color:#a5b4fc}.meta{min-width:0;flex:1}.meta b,.meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta b{font-size:13px}.meta small{font-size:11px;color:var(--muted);margin-top:2px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#ffffffef;border-top:1px solid var(--line);padding:5px 7px calc(5px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}.nav button{min-height:48px;border-radius:10px;background:transparent;color:var(--muted);font-size:11px;font-weight:750;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}.nav button.active{background:var(--soft);color:var(--brand)}.nav i{font-style:normal;font-size:17px;line-height:1}.backdrop{position:fixed;inset:0;z-index:10;background:#0f172a99;padding:12px;display:flex;align-items:flex-end;justify-content:center}.backdrop.hidden{display:none}.modal{width:min(100%,560px);max-height:92dvh;overflow:auto;background:white;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:9px}.modal .prompt{min-height:130px;max-height:30dvh;font-size:12px}.modal .html{min-height:100px;font-family:ui-monospace,monospace;font-size:12px}.note{font-size:12px;color:var(--muted);margin:0}.toast{position:fixed;z-index:20;bottom:76px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:9px 13px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1}@media(min-width:600px){.backdrop{align-items:center}}@media(max-height:620px){.app{gap:6px;padding-top:6px}.top{padding:8px 12px}.status{padding:6px 10px}.panel{padding:9px;gap:7px}.create-input{min-height:55px}.nav button{min-height:42px}.preview{min-height:55px}.edit-input{height:50px}.modal{max-height:95dvh}}
</style>
</head>
<body>
<main class="app">
<header class="top"><strong>✨ App-Studio</strong><span class="badge">자연어 앱 개발</span></header>
<div class="status"><span id="activeName">나의 첫 앱</span><span class="version" id="activeVersion">v1</span></div>
<section class="view active" id="view-home"><div class="panel"><div class="panel-head"><h2>새 앱</h2></div><textarea class="field create-input" id="createText" placeholder="만들 앱을 적고 Enter"></textarea><button class="btn primary full" id="makePrompt">✨ 프롬프트 만들기</button><p class="note">AI에 자동 붙여넣기·전송은 지원하지 않습니다. 버튼을 누르면 프롬프트 복사 후 AI가 열립니다.</p></div></section>
<section class="view" id="view-preview"><div class="panel"><div class="panel-head"><h2>미리보기</h2><div class="grid"><button class="btn small outline" id="refresh">↻ 새로고침</button><button class="btn small primary" id="download">↓ HTML</button></div></div><div class="preview"><iframe id="frame" title="앱 미리보기" sandbox="allow-scripts allow-forms allow-modals"></iframe></div><textarea class="field edit-input" id="editText" placeholder="수정할 내용을 적으세요"></textarea><div id="imageBox" class="attachment"><img id="imagePreview" alt="첨부 미리보기"><button class="remove" id="removeImage" aria-label="이미지 삭제">×</button></div><div class="grid"><button class="btn outline" id="capture">📸 캡처</button><button class="btn outline" id="attach">🖼️ 이미지 첨부</button></div><input id="imageFile" type="file" accept="image/*" hidden><button class="btn pink full" id="editPrompt">수정 프롬프트 만들기</button></div></section>
<section class="view" id="view-projects"><div class="panel"><div class="panel-head"><h2>프로젝트</h2><button class="btn small primary" id="newProject">＋ 새 앱</button></div><div class="list" id="projects"></div><div class="grid"><button class="btn outline" id="importButton">HTML 가져오기</button><button class="btn outline" id="backupButton">백업 내보내기</button></div><button class="btn outline full" id="restoreButton">백업 복원</button><input id="htmlFile" type="file" accept=".html,.htm,text/html" hidden><input id="backupFile" type="file" accept=".json,application/json" hidden></div></section>
<section class="view" id="view-history"><div class="panel"><div class="panel-head"><h2>작업 기록</h2></div><div class="list" id="history"></div></div></section>
</main>
<nav class="nav"><button class="active" data-view="home"><i>✨</i>새 앱</button><button data-view="preview"><i>📱</i>미리보기</button><button data-view="projects"><i>📁</i>프로젝트</button><button data-view="history"><i>🕒</i>기록</button></nav>
<div class="backdrop hidden" id="modal"><div class="modal"><div class="panel-head"><h2 id="modalTitle">프롬프트 검토</h2><button class="btn small outline" id="closeModal">닫기</button></div><p class="note" id="plan"></p><textarea class="field prompt" id="prompt" readonly></textarea><button class="btn primary full" id="copyAndOpen">📋 프롬프트 복사하고 AI 열기</button><div class="grid"><button class="btn outline" id="copyPrompt">프롬프트만 복사</button><button class="btn green" id="applyHtml">결과 HTML 적용</button></div><textarea class="field html" id="htmlResult" placeholder="외부 AI 응답에서 전체 HTML을 복사해 여기에 붙여넣으세요"></textarea><p class="note">외부 AI에 프롬프트를 붙여넣고 전송한 다음, 결과 HTML을 이 칸에 붙여넣으세요. 이미지 수정은 AI 대화창에도 이미지 파일을 직접 첨부해야 합니다. 승인 전까지 프로젝트는 변경되지 않습니다.</p></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var KEY='app-studio.projects.v1',ACTIVE='app-studio.active.v1';
var STARTER='<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 첫 앱</title><style>body{font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2ff;color:#172033}.card{background:white;padding:28px;border-radius:20px;text-align:center;box-shadow:0 8px 25px #0001}button{padding:12px 18px;border:0;border-radius:10px;background:#4f46e5;color:white;font-weight:bold}</style><div class="card"><h2>나의 첫 앱</h2><p>미리보기</p><button onclick="this.textContent=&quot;작동 중 ✓&quot;">테스트</button></div></html>';
var projects=[],activeId='',pendingMode='',pendingRequest='',imageData='';
function el(id){return document.getElementById(id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function dateText(){return new Date().toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'})}
function current(){return projects.find(function(p){return p.id===activeId})||projects[0]||null}
function toast(msg){var t=el('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(function(){t.classList.remove('show')},2400)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(projects));localStorage.setItem(ACTIVE,activeId)}catch(e){toast('저장 실패 · 백업 공간을 확인하세요')}}
function makeProject(name,code,note){var d=dateText();return{id:uid(),name:name||'새 앱',code:code,updated:d,versions:[{label:'v1',date:d,note:note,beforeCode:'',afterCode:code}]}}
function makePrompt(mode,text){var p=current();var lines;if(mode==='create'){lines=['스마트폰 우선 단일 HTML 앱을 제작하라.','[사용자 요구사항]',text,'','[필수 조건]','- 요구사항을 임의로 줄이거나 바꾸지 않는다.','- 단일 HTML 파일(HTML/CSS/JavaScript 포함)로 만든다.','- 모바일 화면에 맞고 실제 기능이 작동하도록 구현한다.','- 전체 실행 가능한 HTML 코드만 출력한다.'];}else{lines=['기존 HTML 앱을 분석하고 사용자의 수정 요청을 반영하라.','[앱 이름 및 버전]',p.name+' / v'+p.versions.length,'','[수정 요청]',text,'','[보존 조건]','- 기존 기능과 저장 데이터를 유지한다.','- 요청하지 않은 기능을 삭제하거나 변경하지 않는다.','- 전체 실행 가능한 수정 HTML 코드만 출력한다.','','[기존 HTML]',p.code];}return lines.join('\n')}
function openPrompt(mode,text){pendingMode=mode;pendingRequest=text;el('prompt').value=makePrompt(mode,text);el('htmlResult').value='';el('modalTitle').textContent=mode==='create'?'새 앱 만들기':'앱 수정';el('plan').textContent=mode==='create'?'프롬프트를 복사해 AI에게 전달하고, 생성된 HTML을 아래에 붙여넣으세요.':'수정 프롬프트를 AI에게 전달하세요. 기존 앱은 결과를 적용하기 전까지 그대로 보존됩니다.';if(imageData)el('plan').textContent+=' 이미지도 외부 AI 대화에 직접 첨부하세요.';el('modal').classList.remove('hidden')}
function copyOnly(){var text=el('prompt').value;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('프롬프트를 복사했습니다')}).catch(function(){el('prompt').focus();el('prompt').select();document.execCommand('copy');toast('프롬프트를 복사했습니다')})}else{el('prompt').focus();el('prompt').select();document.execCommand('copy');toast('프롬프트를 복사했습니다')}}
function copyAndOpen(){var opened=window.open('https://chatgpt.com/','_blank');var text=el('prompt').value;function done(){if(!opened)toast('프롬프트 복사 완료 · 팝업이 차단되어 ChatGPT를 직접 열어주세요');else toast('프롬프트 복사 완료 · ChatGPT에 붙여넣으세요')}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){el('prompt').focus();el('prompt').select();document.execCommand('copy');done()})}else{el('prompt').focus();el('prompt').select();document.execCommand('copy');done()}}
function applyHtml(){var code=el('htmlResult').value.trim();if(!/<(?:!doctype\s+html|html|body)\b/i.test(code)){toast('전체 HTML 결과를 붙여넣으세요');return}if(pendingMode==='create'){var name=pendingRequest.slice(0,24).trim()||'새 앱';var created=makeProject(name,code,'자연어 생성');projects.unshift(created);activeId=created.id;el('createText').value=''}else{var p=current();if(!p)return;var before=p.code;var label='v'+(p.versions.length+1);p.versions.push({label:label,date:dateText(),note:'수정: '+pendingRequest.slice(0,30),beforeCode:before,afterCode:code});p.code=code;p.updated=dateText();el('editText').value='';clearImage()}save();el('modal').classList.add('hidden');render();showView('preview');toast('HTML을 저장했습니다 · '+(pendingMode==='create'?'v1':'새 버전'))}
function addRow(box,heading,sub,buttonText,onClick,disabled){var row=document.createElement('div');row.className='item';var meta=document.createElement('div');meta.className='meta';var b=document.createElement('b');b.textContent=heading;var small=document.createElement('small');small.textContent=sub;meta.appendChild(b);meta.appendChild(small);row.appendChild(meta);if(buttonText){var btn=document.createElement('button');btn.className='btn small outline';btn.textContent=buttonText;btn.disabled=!!disabled;btn.onclick=onClick;row.appendChild(btn)}box.appendChild(row)}
function renderProjects(){var box=el('projects');box.replaceChildren();projects.forEach(function(p){addRow(box,p.name,'v'+p.versions.length+' · '+p.updated,p.id===activeId?'선택됨':'선택',function(){activeId=p.id;save();render();toast('프로젝트를 선택했습니다')});if(p.id===activeId)box.lastChild.classList.add('active')})}
function renderHistory(){var box=el('history');box.replaceChildren();var p=current();if(!p)return;p.versions.slice().reverse().forEach(function(v,index){addRow(box,v.label+(index===0?' · 현재':''),v.date+' · '+v.note,'복구',function(){if(!window.confirm(v.label+' 버전으로 복구할까요? 현재 버전은 보존됩니다.'))return;var old=p.code;p.code=v.afterCode;var label='v'+(p.versions.length+1);p.versions.push({label:label,date:dateText(),note:v.label+' 복구',beforeCode:old,afterCode:p.code});p.updated=dateText();save();render();toast('복구 완료')},index===0)})}
function render(){var p=current();if(!p)return;el('activeName').textContent=p.name;el('activeVersion').textContent='v'+p.versions.length;el('frame').srcdoc=p.code;renderProjects();renderHistory()}
function showView(name){document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('active',v.id==='view-'+name)});document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-view')===name)});if(name==='preview')render()}
function clearImage(){imageData='';el('imageFile').value='';el('imagePreview').removeAttribute('src');el('imageBox').classList.remove('show')}
function setImage(file){if(!file)return;if(!file.type.startsWith('image/')){toast('이미지 파일을 선택하세요');return}var reader=new FileReader();reader.onload=function(){imageData=String(reader.result);el('imagePreview').src=imageData;el('imageBox').classList.add('show')};reader.onerror=function(){toast('이미지를 읽지 못했습니다')};reader.readAsDataURL(file)}
function capture(){if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){toast('캡처 미지원 · 이미지 첨부를 이용하세요');el('imageFile').click();return}navigator.mediaDevices.getDisplayMedia({video:true}).then(function(stream){var video=document.createElement('video');video.srcObject=stream;video.onloadedmetadata=function(){video.play();var canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);stream.getTracks().forEach(function(track){track.stop()});canvas.toBlob(function(blob){if(blob)setImage(new File([blob],'capture.png',{type:'image/png'}))},'image/png')}}).catch(function(){toast('캡처를 사용할 수 없습니다 · 이미지 첨부를 이용하세요');el('imageFile').click()})}
function download(){var p=current();if(!p)return;var url=URL.createObjectURL(new Blob([p.code],{type:'text/html;charset=utf-8'}));var a=document.createElement('a');a.href=url;a.download=(p.name.replace(/[\\/:*?"<>|]/g,'_')||'app')+'.html';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function init(){try{projects=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(projects))projects=[];activeId=localStorage.getItem(ACTIVE)||''}catch(e){projects=[];activeId=''}if(!projects.length){var first=makeProject('나의 첫 앱',STARTER,'기본 템플릿');projects.push(first);activeId=first.id;save()}if(!current()){activeId=projects[0].id;save()}render();document.querySelectorAll('.nav button').forEach(function(btn){btn.addEventListener('click',function(){showView(btn.getAttribute('data-view'))})});el('makePrompt').addEventListener('click',function(){var text=el('createText').value.trim();if(!text){toast('만들 앱 내용을 입력하세요');return}openPrompt('create',text)});el('createText').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el('makePrompt').click()}});el('editPrompt').addEventListener('click',function(){var text=el('editText').value.trim();if(!text){toast('수정 내용을 입력하세요');return}openPrompt('edit',text)});el('closeModal').addEventListener('click',function(){el('modal').classList.add('hidden')});el('copyPrompt').addEventListener('click',copyOnly);el('copyAndOpen').addEventListener('click',copyAndOpen);el('applyHtml').addEventListener('click',applyHtml);el('refresh').addEventListener('click',function(){render();toast('미리보기를 새로고침했습니다')});el('download').addEventListener('click',download);el('attach').addEventListener('click',function(){el('imageFile').click()});el('imageFile').addEventListener('change',function(e){setImage(e.target.files[0])});el('removeImage').addEventListener('click',clearImage);el('capture').addEventListener('click',capture);el('newProject').addEventListener('click',function(){showView('home')});el('importButton').addEventListener('click',function(){el('htmlFile').click()});el('htmlFile').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){var p=makeProject(file.name.replace(/\.html?$/i,''),String(reader.result||''),'HTML 가져오기');projects.unshift(p);activeId=p.id;save();render();showView('preview')};reader.readAsText(file);e.target.value='' });el('backupButton').addEventListener('click',function(){var blob=new Blob([JSON.stringify({format:'app-studio-v1',projects:projects},null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='app-studio-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)});el('restoreButton').addEventListener('click',function(){el('backupFile').click()});el('backupFile').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!Array.isArray(data.projects))throw new Error('invalid');data.projects.forEach(function(item){if(!item||typeof item.code!=='string')throw new Error('invalid');var copy=JSON.parse(JSON.stringify(item));copy.id=uid();if(!Array.isArray(copy.versions)||!copy.versions.length)copy.versions=[{label:'v1',date:dateText(),note:'복원',beforeCode:'',afterCode:copy.code}];projects.push(copy)});activeId=projects[projects.length-1].id;save();render();toast('백업을 복원했습니다')}catch(err){toast('백업 파일을 확인하세요')}};reader.readAsText(file);e.target.value=''})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
