<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>App-Studio</title>
<style>
:root{--bg:#f4f6fb;--paper:#fff;--ink:#172033;--muted:#667085;--line:#e2e8f0;--brand:#4f46e5;--soft:#eef2ff;--pink:#db2777;--green:#059669}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Noto Sans KR",sans-serif}button,textarea{font:inherit}button{border:0;cursor:pointer}.app{height:100dvh;height:100svh;width:min(100%,620px);margin:auto;padding:10px 12px 72px;display:flex;flex-direction:column;gap:9px;overflow:hidden}.top{padding:12px 15px;border-radius:16px;background:linear-gradient(130deg,#4f46e5,#9333ea);color:#fff;display:flex;justify-content:space-between}.status,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.status{display:flex;justify-content:space-between;font-weight:750}.version{color:var(--brand);background:var(--soft);border-radius:7px;padding:3px 7px}.view{display:none;flex:1;min-height:0;overflow:hidden}.view.active{display:flex}.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;overflow:hidden}.panel h2{font-size:16px;margin:0}.field{width:100%;border:1px solid var(--line);border-radius:11px;background:#f8fafc;padding:11px;color:var(--ink);resize:vertical}.create-input{flex:1;min-height:90px;resize:none}.btn{min-height:40px;padding:8px 11px;border-radius:10px;background:#f1f5f9;color:#334155;font-weight:700}.primary{background:var(--brand);color:#fff}.pink{background:var(--pink);color:#fff}.green{background:var(--green);color:white}.outline{background:#fff;border:1px solid var(--line)}.small{min-height:32px;padding:5px 8px;font-size:12px}.full{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.note{font-size:12px;color:var(--muted);margin:0}.preview{flex:1;min-height:0;background:#fff}iframe{width:100%;height:100%;border:0}.toolbar{display:flex;align-items:center;gap:6px;padding:5px;border-bottom:1px solid var(--line)}.toolbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tools{max-height:42%;overflow:auto;border-top:1px solid var(--line);padding:7px}.tools summary{font-size:12px;font-weight:bold;color:var(--brand);cursor:pointer}.tools textarea{height:54px}.list{overflow:auto;display:flex;flex-direction:column;gap:7px}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:9px}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:5px}.nav button{background:transparent;color:var(--muted);font-size:12px;padding:9px 2px}.nav button.active{color:var(--brand);background:var(--soft);border-radius:9px}.backdrop{position:fixed;inset:0;z-index:10;background:#0f172a99;padding:12px;display:flex;align-items:flex-end;justify-content:center}.backdrop.hidden{display:none}.modal{width:min(100%,560px);max-height:92dvh;overflow:auto;background:white;border-radius:17px;padding:13px;display:flex;flex-direction:column;gap:8px}.modal .prompt{min-height:150px;font-size:12px;resize:vertical}.modal .html{min-height:100px;font-family:monospace;font-size:12px}.toast{position:fixed;z-index:20;bottom:76px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:9px 13px;border-radius:20px;opacity:0;pointer-events:none}.toast.show{opacity:1}body.preview-mode .app{position:fixed;inset:0;width:100%;height:100dvh;height:100svh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);gap:0;margin:0}body.preview-mode .top,body.preview-mode .status,body.preview-mode .nav{display:none}body.preview-mode #view-preview{display:flex;position:absolute;inset:0}body.preview-mode #view-preview>.panel{border:0;border-radius:0;padding:0;gap:0}body.preview-mode .preview{border:0}body.preview-mode .toast{bottom:12px}
</style></head><body><main class="app"><header class="top"><b>✨ App-Studio</b><span>자연어 앱 개발</span></header><div class="status"><span id="activeName">나의 첫 앱</span><span class="version" id="activeVersion">v1</span></div>
<section class="view active" id="view-home"><div class="panel"><h2>새 앱</h2><textarea id="createText" class="field create-input" placeholder="만들 앱을 설명하세요"></textarea><button id="makePrompt" class="btn primary full">✨ 앱 개발 프롬프트 만들기</button><p class="note">프롬프트에는 이 입력란에 작성한 설명만 포함됩니다. 이전 AI 대화의 내용은 앱 설명으로 사용하지 마세요.</p></div></section>
<section class="view" id="view-preview"><div class="panel"><div class="toolbar"><button class="btn small outline" id="exitPreview">←</button><b id="previewTitle">미리보기</b><button class="btn small outline" id="refresh">↻</button><button class="btn small outline" id="toggleTools">수정</button><button class="btn small outline" id="download">↓</button></div><div class="preview"><iframe id="frame" title="앱 미리보기" sandbox="allow-scripts allow-forms allow-modals"></iframe></div><details class="tools" id="tools"><summary>수정 도구 펼치기</summary><textarea id="editText" class="field" placeholder="수정할 내용을 적으세요"></textarea><button id="editPrompt" class="btn pink full">수정 프롬프트 만들기</button></details></div></section>
<section class="view" id="view-projects"><div class="panel"><h2>프로젝트</h2><div class="list" id="projects"></div><div class="grid"><button class="btn outline" id="importButton">HTML 가져오기</button><button class="btn outline" id="backupButton">백업 내보내기</button></div><button class="btn outline full" id="restoreButton">백업 복원</button><input id="htmlFile" type="file" accept=".html,.htm,text/html" hidden><input id="backupFile" type="file" accept=".json,application/json" hidden></div></section><section class="view" id="view-history"><div class="panel"><h2>작업 기록</h2><div class="list" id="history"></div></div></section></main>
<nav class="nav"><button class="active" data-view="home">✨ 새 앱</button><button data-view="preview">📱 미리보기</button><button data-view="projects">📁 프로젝트</button><button data-view="history">🕒 기록</button></nav>
<div class="backdrop hidden" id="modal"><div class="modal"><div class="toolbar"><b id="modalTitle">프롬프트 확인</b><button class="btn small outline" id="closeModal">닫기</button></div><p class="note" id="plan"></p><textarea id="prompt" class="field prompt" readonly></textarea><button id="copyAndOpen" class="btn primary full">📋 복사하고 새 AI 대화 열기</button><div class="grid"><button id="copyPrompt" class="btn outline">프롬프트만 복사</button><button id="applyHtml" class="btn green">결과 HTML 적용</button></div><textarea id="htmlResult" class="field html" placeholder="외부 AI가 만든 전체 HTML을 여기에 붙여넣으세요"></textarea><p class="note">외부 AI에서는 새 대화를 시작한 뒤 프롬프트를 붙여넣으세요. HTML 결과를 붙여넣고 적용해야 저장됩니다.</p></div></div><div id="toast" class="toast"></div>
<script>
(function(){'use strict';var KEY='app-studio.projects.v1',ACTIVE='app-studio.active.v1',projects=[],activeId='',pendingMode='',pendingRequest='';function $(id){return document.getElementById(id)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function stamp(){return new Date().toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'})}function current(){return projects.find(function(p){return p.id===activeId})||projects[0]}function toast(s){var t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2400)}function save(){try{localStorage.setItem(KEY,JSON.stringify(projects));localStorage.setItem(ACTIVE,activeId)}catch(e){toast('저장 공간이 부족합니다')}}function fresh(name,code,note){var d=stamp();return{id:uid(),name:name||'새 앱',code:code,updated:d,versions:[{label:'v1',date:d,note:note,beforeCode:'',afterCode:code}]}}
// BUGFIX: creation prompts are built only from the current createText value. No saved essay, project data, or conversation history is read here.
function makePrompt(mode,text){var request=String(text||'').trim();if(mode==='create')return ['새로운 앱 개발 요청입니다. 반드시 아래 [이번 앱 설명]만 요구사항으로 사용하세요. 이전 대화, 과거 프롬프트, 다른 문서의 주제나 내용을 절대로 가져오지 마세요.','[이번 앱 설명 시작]',request,'[이번 앱 설명 끝]','','위 요구사항에 맞는 앱을 제작하세요. 요구사항을 다른 주제로 바꾸거나 원고를 답변으로 다시 작성하지 마세요.','필수 조건:','- 스마트폰에 최적화된 반응형 UI','- 요청된 기능을 실제 작동하도록 구현','- HTML, CSS, JavaScript를 포함한 완전한 단일 HTML 파일','- 코드 외 설명 없이 <!doctype html>부터 </html>까지 전체 HTML만 출력'].join('\n');var p=current();return ['기존 앱을 수정하세요. 이전 대화의 내용은 사용하지 말고 아래 [이번 수정 요청]만 반영하세요.','[이번 수정 요청 시작]',request,'[이번 수정 요청 끝]','','기존 앱의 요청하지 않은 기능은 보존하고, 실행 가능한 전체 단일 HTML 파일만 출력하세요.','','[기존 앱 HTML]',p?p.code:''].join('\n')}
function showPrompt(mode,text){pendingMode=mode;pendingRequest=text;$('prompt').value=makePrompt(mode,text);$('htmlResult').value='';$('modalTitle').textContent=mode==='create'?'새 앱 개발 프롬프트':'앱 수정 프롬프트';$('plan').textContent='프롬프트에 이번 입력 설명만 포함했는지 확인하세요. 기존 앱 설명이나 이전 대화 내용은 새 앱 요구사항에 포함하지 않습니다.';$('modal').classList.remove('hidden')}
function copyText(){var t=$('prompt');t.focus();t.select();try{document.execCommand('copy');toast('프롬프트를 복사했습니다')}catch(e){toast('프롬프트를 길게 눌러 복사하세요')}}function openAI(){copyText();window.open('https://chatgpt.com/','_blank');toast('복사 완료 · 외부 AI에서 새 대화를 열어 붙여넣으세요')}
function apply(){var code=$('htmlResult').value.trim();if(!/<(?:!doctype\s+html|html|body)\b/i.test(code)){toast('전체 HTML 결과를 붙여넣으세요');return}if(pendingMode==='create'){var p=fresh(pendingRequest.slice(0,30)||'새 앱',code,'새 앱 생성');projects.unshift(p);activeId=p.id}else{var p=current(),d=stamp();p.versions.push({label:'v'+(p.versions.length+1),date:d,note:'수정: '+pendingRequest.slice(0,25),beforeCode:p.code,afterCode:code});p.code=code;p.updated=d}$('modal').classList.add('hidden');save();render();go('preview')}
function render(){var p=current();if(!p)return;$('activeName').textContent=p.name;$('activeVersion').textContent='v'+p.versions.length;$('previewTitle').textContent=p.name;$('frame').srcdoc=p.code;var box=$('projects');box.replaceChildren();projects.forEach(function(x){var r=document.createElement('div');r.className='item';var label=document.createElement('span');label.textContent=x.name+' · v'+x.versions.length;r.appendChild(label);var b=document.createElement('button');b.className='btn small outline';b.textContent=x.id===activeId?'선택됨':'선택';b.onclick=function(){activeId=x.id;save();render()};r.appendChild(b);box.appendChild(r)});var hist=$('history');hist.replaceChildren();p.versions.slice().reverse().forEach(function(v,i){var r=document.createElement('div');r.className='item';var s=document.createElement('span');s.textContent=v.label+' · '+v.date+' · '+v.note;r.appendChild(s);if(i){var b=document.createElement('button');b.className='btn small outline';b.textContent='복구';b.onclick=function(){if(confirm(v.label+' 버전으로 복구할까요?')){var d=stamp();p.versions.push({label:'v'+(p.versions.length+1),date:d,note:v.label+' 복구',beforeCode:p.code,afterCode:v.afterCode});p.code=v.afterCode;save();render()}};r.appendChild(b)}hist.appendChild(r)})}
function go(name){document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('active',x.id==='view-'+name)});document.querySelectorAll('.nav button').forEach(function(x){x.classList.toggle('active',x.dataset.view===name)});document.body.classList.toggle('preview-mode',name==='preview');if(name==='preview'){$('tools').open=false;render()}}
function download(){var p=current(),url=URL.createObjectURL(new Blob([p.code],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download=(p.name||'app')+'.html';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}function init(){try{projects=JSON.parse(localStorage.getItem(KEY)||'[]');activeId=localStorage.getItem(ACTIVE)||'';if(!Array.isArray(projects))projects=[]}catch(e){projects=[]}if(!current()){var p=fresh('나의 첫 앱','<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font:18px system-ui;text-align:center;padding:20vh 10px">미리보기 앱</body></html>','기본 템플릿');projects=[p];activeId=p.id;save()}render();document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){go(b.dataset.view)}});$('makePrompt').onclick=function(){var text=$('createText').value.trim();if(!text){toast('만들 앱 설명을 입력하세요');return}showPrompt('create',text)};$('editPrompt').onclick=function(){var text=$('editText').value.trim();if(!text){toast('수정 내용을 입력하세요');return}showPrompt('edit',text)};$('closeModal').onclick=function(){$('modal').classList.add('hidden')};$('copyPrompt').onclick=copyText;$('copyAndOpen').onclick=openAI;$('applyHtml').onclick=apply;$('exitPreview').onclick=function(){go('home')};$('toggleTools').onclick=function(){$('tools').open=!$('tools').open};$('refresh').onclick=render;$('download').onclick=download;$('importButton').onclick=function(){$('htmlFile').click()};$('htmlFile').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var p=fresh(f.name.replace(/\.html?$/i,''),String(r.result),'HTML 가져오기');projects.unshift(p);activeId=p.id;save();render();go('preview')};r.readAsText(f);e.target.value=''};$('backupButton').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({projects:projects})],{type:'application/json'}));a.download='app-studio-backup.json';a.click()};$('restoreButton').onclick=function(){$('backupFile').click()};$('backupFile').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var data=JSON.parse(r.result);if(!Array.isArray(data.projects))throw 0;data.projects.forEach(function(p){if(typeof p.code!=='string')throw 0;p.id=uid();projects.push(p)});activeId=projects[projects.length-1].id;save();render();toast('백업을 복원했습니다')}catch(x){toast('백업 파일을 확인하세요')}};r.readAsText(f)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();
</script></body></html>
