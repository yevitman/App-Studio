<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>App-Studio</title>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--paper:#fff;--ink:#172033;--muted:#667085;--line:#e2e8f0;--brand:#4f46e5;--soft:#eef2ff;--pink:#db2777;--green:#059669;--shadow:0 6px 20px #17203312}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input,textarea{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{height:100dvh;height:100svh;width:min(100%,620px);margin:auto;padding:10px 12px calc(72px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;overflow:hidden}.top{flex:none;padding:12px 15px;border-radius:16px;background:linear-gradient(130deg,#4f46e5,#9333ea);color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}.top strong{font-size:17px}.badge{font-size:11px;background:#ffffff30;padding:4px 8px;border-radius:20px}.status{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}.status span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}.version{color:var(--brand);background:var(--soft);border-radius:7px;padding:3px 7px;font-size:12px;font-weight:800}.view{display:none;flex:1;min-height:0;overflow:hidden}.view.active{display:flex}.panel{flex:1;min-height:0;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}.panel-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-head h2{margin:0;font-size:16px}.field{width:100%;border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:12px;color:var(--ink);outline:none;resize:none}.field:focus{border-color:var(--brand);background:white}.create-input{flex:1;min-height:100px}.edit-input{height:68px;flex:none}.btn{min-height:42px;padding:9px 12px;border-radius:11px;background:#f1f5f9;color:#334155;font-weight:750;white-space:nowrap}.btn.primary{background:var(--brand);color:white}.btn.pink{background:var(--pink);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.outline{background:#fff;border:1px solid var(--line)}.btn.small{min-height:34px;padding:6px 9px;font-size:12px}.btn.full{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview{flex:1;min-height:100px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}.attachment{display:none;position:relative;width:max-content;max-width:100%;border:1px solid var(--line);border-radius:9px;overflow:hidden}.attachment.show{display:block}.attachment img{display:block;max-height:70px;max-width:100%}.remove{position:absolute;right:4px;top:4px;border-radius:50%;background:#172033c9;color:#fff;width:23px;height:23px}.list{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:7px}.item{flex:none;border:1px solid var(--line);border-radius:11px;background:#fafbff;padding:9px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}.item.active{background:var(--soft);border-color:#a5b4fc}.meta{min-width:0;flex:1}.meta b,.meta small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta b{font-size:13px}.meta small{font-size:11px;color:var(--muted);margin-top:2px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#ffffffef;border-top:1px solid var(--line);padding:5px 7px calc(5px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}.nav button{min-height:48px;border-radius:10px;background:transparent;color:var(--muted);font-size:11px;font-weight:750;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}.nav button.active{background:var(--soft);color:var(--brand)}.nav i{font-style:normal;font-size:17px;line-height:1}.backdrop{position:fixed;inset:0;z-index:10;background:#0f172a99;padding:12px;display:flex;align-items:flex-end;justify-content:center}.backdrop.hidden{display:none}.modal{width:min(100%,560px);max-height:90dvh;overflow:auto;background:white;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:9px}.modal .prompt{min-height:120px;max-height:28dvh;font-size:12px}.modal .html{min-height:100px;font-family:ui-monospace,monospace;font-size:12px}.note{font-size:12px;color:var(--muted);margin:0}.toast{position:fixed;z-index:20;bottom:76px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:9px 13px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1}@media(min-width:600px){.backdrop{align-items:center}}@media(max-height:620px){.app{gap:6px;padding-top:6px}.top{padding:8px 12px}.status{padding:6px 10px}.panel{padding:9px;gap:7px}.create-input{min-height:65px}.nav button{min-height:42px}.preview{min-height:65px}.edit-input{height:54px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><strong>✨ App-Studio</strong><span class="badge">자연어 앱 개발</span></header>
  <div class="status"><span id="activeName">나의 첫 앱</span><span class="version" id="activeVersion">v1</span></div>
  <section class="view active" id="view-home"><div class="panel"><div class="panel-head"><h2>새 앱</h2></div><textarea class="field create-input" id="createText" placeholder="만들 앱을 적고 Enter"></textarea><button class="btn primary full" id="makePrompt">✨ 프롬프트 만들기</button><p class="note">AI 연결 없음 · 생성한 프롬프트를 외부 AI에 전달하고 결과 HTML을 가져오세요.</p></div></section>
  <section class="view" id="view-preview"><div class="panel"><div class="panel-head"><h2>미리보기</h2><div class="grid"><button class="btn small outline" id="refresh">↻ 새로고침</button><button class="btn small primary" id="download">↓ HTML</button></div></div><div class="preview"><iframe id="frame" title="앱 미리보기" sandbox="allow-scripts allow-forms allow-modals"></iframe></div><textarea class="field edit-input" id="editText" placeholder="수정할 내용을 적으세요"></textarea><div id="imageBox" class="attachment"><img id="imagePreview" alt="첨부 미리보기"><button class="remove" id="removeImage" aria-label="이미지 삭제">×</button></div><div class="grid"><button class="btn outline" id="capture">📸 캡처</button><button class="btn outline" id="attach">🖼️ 이미지 첨부</button></div><input id="imageFile" type="file" accept="image/*" hidden><button class="btn pink full" id="editPrompt">수정 프롬프트 만들기</button></div></section>
  <section class="view" id="view-projects"><div class="panel"><div class="panel-head"><h2>프로젝트</h2><button class="btn small primary" id="newProject">＋ 새 앱</button></div><div class="list" id="projects"></div><div class="grid"><button class="btn outline" id="importButton">HTML 가져오기</button><button class="btn outline" id="backupButton">백업 내보내기</button></div><button class="btn outline full" id="restoreButton">백업 복원</button><input id="htmlFile" type="file" accept=".html,.htm,text/html" hidden><input id="backupFile" type="file" accept=".json,application/json" hidden></div></section>
  <section class="view" id="view-history"><div class="panel"><div class="panel-head"><h2>작업 기록</h2></div><div class="list" id="history"></div></div></section>
</main>
<nav class="nav"><button class="active" data-view="home"><i>✨</i>새 앱</button><button data-view="preview"><i>📱</i>미리보기</button><button data-view="projects"><i>📁</i>프로젝트</button><button data-view="history"><i>🕒</i>기록</button></nav>
<div class="backdrop hidden" id="modal"><div class="modal"><div class="panel-head"><h2 id="modalTitle">프롬프트 검토</h2><button class="btn small outline" id="closeModal">닫기</button></div><p class="note" id="plan"></p><textarea class="field prompt" id="prompt" readonly></textarea><div class="grid"><button class="btn outline" id="copyPrompt">프롬프트 복사</button><button class="btn green" id="approve">승인 · HTML 반영</button></div><textarea class="field html" id="htmlResult" placeholder="외부 AI가 만든 전체 HTML을 여기에 붙여넣으세요. 비워두면 앱은 변경되지 않습니다."></textarea><p class="note">승인은 작업 진행 동의입니다. HTML 결과를 붙여넣어야 실제 앱에 반영됩니다. 이미지가 있으면 외부 AI에도 별도로 첨부하세요.</p></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='app-studio.projects.v1',ACTIVE='app-studio.active.v1';
const starter='<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 첫 앱</title><style>body{font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2ff;color:#172033}.card{background:white;padding:28px;border-radius:20px;text-align:center;box-shadow:0 8px 25px #0001}button{padding:12px 18px;border:0;border-radius:10px;background:#4f46e5;color:white;font-weight:bold}</style><div class="card"><h2>나의 첫 앱</h2><p>미리보기</p><button onclick="this.textContent=\'작동 중 ✓\'">테스트</button></div></html>';
let projects=[],activeId='',pending='',request='',imageData='';const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),date=()=>new Date().toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'}),current=()=>projects.find(p=>p.id===activeId)||projects[0];
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(projects));localStorage.setItem(ACTIVE,activeId)}catch(e){toast('저장 실패 · 백업 공간을 확인하세요')}}
function newProject(name,code,note){const d=date();return{id:uid(),name,code,updated:d,versions:[{label:'v1',date:d,note,beforeCode:'',afterCode:code}]}}
function render(){const p=current();if(!p)return;$('activeName').textContent=p.name;$('activeVersion').textContent='v'+p.versions.length;$('frame').srcdoc=p.code;renderProjects();renderHistory()}
function renderProjects(){const box=$('projects');box.replaceChildren();projects.forEach(p=>{const row=document.createElement('div');row.className='item'+(p.id===activeId?' active':'');const meta=document.createElement('div');meta.className='meta';const b=document.createElement('b');b.textContent=p.name;const s=document.createElement('small');s.textContent='v'+p.versions.length+' · '+p.updated;meta.append(b,s);const btn=document.createElement('button');btn.className='btn small outline';btn.textContent=p.id===activeId?'선택됨':'선택';btn.onclick=()=>{activeId=p.id;save();render();toast('프로젝트 선택됨')};row.append(meta,btn);box.append(row)})}
function renderHistory(){const box=$('history');box.replaceChildren();const p=current();if(!p)return;p.versions.slice().reverse().forEach((v,i)=>{const row=document.createElement('div');row.className='item';const meta=document.createElement('div');meta.className='meta';const b=document.createElement('b');b.textContent=v.label+(i===0?' · 현재':'');const s=document.createElement('small');s.textContent=v.date+' · '+v.note;meta.append(b,s);const btn=document.createElement('button');btn.className='btn small outline';btn.textContent='복구';btn.disabled=i===0;btn.onclick=()=>{if(!confirm(v.label+' 버전으로 복구할까요? 현재 상태를 새 버전으로 보존합니다.'))return;const old=p.code;p.code=v.afterCode;p.versions.push({label:'v'+(p.versions.length+1),date:date(),note:v.label+' 복구',beforeCode:old,afterCode:p.code});p.updated=date();save();render();toast('복구 완료')};row.append(meta,btn);box.append(row)})}
function switchView(name){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='preview')render()}
function openPrompt(mode,text){pending=mode;request=text;$('htmlResult').value='';const p=current();if(mode==='create'){$('modalTitle').textContent='새 앱 프롬프트';$('plan').textContent='요청을 유지해 모바일 앱 제작 프롬프트를 만들었습니다.';$('prompt').value=['스마트폰 우선 단일 HTML 앱을 제작하라.','사용자 요구사항:',text,'','요구사항을 임의로 줄이지 말 것. 단일 HTML로 완성하고 요청한 기능을 구현할 것. 기존 데이터와 기능을 보존할 것. 전체 실행 가능한 HTML만 출력할 것.'].join('\n')}else{$('modalTitle').textContent='수정 프롬프트';$('plan').textContent='현재 '+p.name+' · v'+p.versions.length+' · HTML 반영 전 기존 버전을 보존합니다.';$('prompt').value=['기존 HTML 앱을 분석하고 사용자의 수정 요청을 반영하라.','요구���항:',text,'','기존 기능과 데이터 구조를 보존하고 요청하지 않은 기능은 제거하지 말 것. 완성된 전체 HTML만 출력할 것.','현재 HTML:',p.code].join('\n')}if(imageData)$('plan').textContent+=' · 이미지 첨부됨(외부 AI에도 이미지 파일을 직접 첨부해야 함)';$('modal').classList.remove('hidden')}
function applyResult(){const code=$('htmlResult').value.trim();if(!/<(?:!doctype\s+html|html|body)\b/i.test(code)){copyPrompt();toast('전체 HTML 결과를 붙여넣어야 반영됩니다.');return}if(pending==='create'){const title=request.slice(0,20).trim()||'새 앱';const p=newProject(title,code,'자연어 생성');projects.unshift(p);activeId=p.id;$('createText').value=''}else{const p=current(),old=p.code;p.versions.push({label:'v'+(p.versions.length+1),date:date(),note:'수정: '+request.slice(0,28),beforeCode:old,afterCode:code});p.code=code;p.updated=date();$('editText').value='';clearImage()}save();$('modal').classList.add('hidden');render();switchView('preview');toast('새 버전으로 저장했습니다')}
function copyPrompt(){const text=$('prompt').value;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('프롬프트 복사됨')).catch(()=>{ $('prompt').select();document.execCommand('copy');toast('프롬프트 복���됨')});else{$('prompt').select();document.execCommand('copy');toast('프롬프트 복사됨')}}
function clearImage(){$('imageFile').value='';$('imagePreview').removeAttribute('src');$('imageBox').classList.remove('show');imageData=''}
function setImage(file){if(!file)return;if(!file.type.startsWith('image/'))return toast('이미지 파일을 선택하세요');const r=new FileReader();r.onload=()=>{imageData=String(r.result);$('imagePreview').src=imageData;$('imageBox').classList.add('show')};r.onerror=()=>toast('이미지를 읽지 못했습니다');r.readAsDataURL(file)}
function capture(){if(!navigator.mediaDevices?.getDisplayMedia){toast('캡처 미지원 · 이미지 첨부를 이용하세요');$('imageFile').click();return}navigator.mediaDevices.getDisplayMedia({video:true}).then(stream=>{const v=document.createElement('video');v.srcObject=stream;v.onloadedmetadata=()=>{v.play();const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);stream.getTracks().forEach(t=>t.stop());c.toBlob(blob=>blob&&setImage(new File([blob],'capture.png',{type:'image/png'})),'image/png')}}).catch(()=>{toast('캡처 취소/차단 · 이미지 첨부를 이용하세요');$('imageFile').click()})}
function download(){const p=current();if(!p)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([p.code],{type:'text/html'}));a.download=(p.name.replace(/[\\/:*?"<>|]/g,'_')||'app')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function init(){try{projects=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(projects))projects=[];activeId=localStorage.getItem(ACTIVE)||''}catch(e){projects=[]}if(!projects.length){const p=newProject('나의 첫 앱',starter,'기본 템플릿');projects.push(p);activeId=p.id;save()}if(!current()){activeId=projects[0].id;save()}render();document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('makePrompt').onclick=()=>{const t=$('createText').value.trim();if(!t)return toast('앱 내용을 입력하세요');openPrompt('create',t)};$('createText').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('makePrompt').click()}};$('editPrompt').onclick=()=>{const t=$('editText').value.trim();if(!t)return toast('수정 내용을 입력하세요');openPrompt('edit',t)};$('closeModal').onclick=()=>$('modal').classList.add('hidden');$('copyPrompt').onclick=copyPrompt;$('approve').onclick=applyResult;$('refresh').onclick=()=>{render();toast('새로고침 완료')};$('download').onclick=download;$('attach').onclick=()=>$('imageFile').click();$('imageFile').onchange=e=>setImage(e.target.files[0]);$('removeImage').onclick=clearImage;$('capture').onclick=capture;$('newProject').onclick=()=>switchView('home');$('importButton').onclick=()=>$('htmlFile').click();$('htmlFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const p=newProject(f.name.replace(/\.html?$/i,''),String(r.result||''),'HTML 가져오기');projects.unshift(p);activeId=p.id;save();render();switchView('preview')};r.readAsText(f);e.target.value=''};$('backupButton').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'app-studio-v1',projects},null,2)],{type:'application/json'}));a.download='app-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restoreButton').onclick=()=>$('backupFile').click();$('backupFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.projects))throw Error();data.projects.forEach(x=>{if(typeof x.code!=='string'||!x.code)throw Error();const copy=JSON.parse(JSON.stringify(x));copy.id=uid();if(!Array.isArray(copy.versions)||!copy.versions.length)copy.versions=[{label:'v1',date:date(),note:'복원',beforeCode:'',afterCode:copy.code}];projects.push(copy)});activeId=projects[projects.length-1].id;save();render();toast('백업 복원 완료')}catch(err){toast('백업 파일을 확인하세요')}};r.readAsText(f);e.target.value=''}}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
