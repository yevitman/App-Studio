<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>App Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <a class="brand" href="#create" aria-label="App Studio 홈"><span class="brand-icon">✳</span><strong>App Studio</strong></a>
      <span class="demo-tag">DEMO</span>
    </header>
    <nav class="tabs" aria-label="기능">
      <button class="tab active" data-panel="create"><span>✦</span> 만들기</button>
      <button class="tab" data-panel="preview"><span>◫</span> 미리보기</button>
      <button class="tab" data-panel="versions"><span>⟲</span> 버전</button>
    </nav>
    <main>
      <section class="panel active" id="create">
        <div class="heading"><div><span class="kicker">APP BUILDER</span><h1>무엇을 만들까요?</h1></div><button class="button primary" id="make-prompt">프롬프트 만들기 <span>↗</span></button></div>
        <textarea id="request" class="request" placeholder="만들고 싶은 앱을 입력하고 Enter를 누르세요" aria-label="만들 앱 설명"></textarea>
        <div class="prompt-card">
          <div class="card-head"><strong>✧　프롬프트</strong><button class="button primary" id="approve" disabled>검토 후 승인</button></div>
          <div id="prompt" class="prompt empty">프롬프트가 여기에 표시됩니다</div>
        </div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>

      <section class="panel" id="preview">
        <div class="heading"><div><span class="kicker">PREVIEW</span><h1>미리보기</h1></div><div class="actions"><label class="button secondary upload">＋ 이미지<input id="image" type="file" accept="image/*"></label><button class="button secondary" id="capture">▣ 캡처</button></div></div>
        <div class="preview-frame"><div id="app-preview" class="app-preview"><div class="empty-preview">✳<span>프롬프트를 승인하면 앱이 표시됩니다</span></div></div></div>
        <div class="modify-card">
          <div id="attachment" class="attachment hidden"></div>
          <div class="modify-row"><textarea id="change" rows="2" placeholder="수정할 내용을 입력하세요" aria-label="수정 요청"></textarea><div class="modify-buttons"><button class="button secondary" id="clear">초기화</button><button class="button primary" id="send-change">프롬프트 만들기 ↗</button></div></div>
        </div>
      </section>

      <section class="panel" id="versions">
        <div class="heading"><div><span class="kicker">HISTORY</span><h1>버전</h1></div></div>
        <div id="version-list" class="version-list"></div>
      </section>
    </main>
    <footer>데모 · 생성된 프롬프트는 실제 AI 코드 생성과 연결되어 있지 않습니다.</footer>
  </div>
  <dialog id="confirm-dialog"><div class="dialog-inner"><span class="kicker">PROMPT</span><h2>이 내용으로 진행할까요?</h2><pre id="dialog-prompt"></pre><div class="dialog-actions"><button class="button secondary" id="cancel">취소</button><button class="button primary" id="confirm">승인하고 적용</button></div></div></dialog>
</body>
</html>
