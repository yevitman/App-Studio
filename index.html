<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">A</div>
        <div class="brand-text">
          <div class="brand-name">App Studio</div>
          <div class="brand-sub">Prompt → Build</div>
        </div>
      </div>

      <nav class="nav" aria-label="메인 메뉴">
        <button class="nav-btn active" data-panel="create">✦ 생성</button>
        <button class="nav-btn" data-panel="preview">◫ 미리보기</button>
        <button class="nav-btn" data-panel="versions">⟲ 버전</button>
      </nav>
    </aside>

    <main class="main">
      <section class="panel active" id="create">
        <div class="row head-row">
          <div>
            <div class="eyebrow">생성</div>
            <h1>앱 만들기</h1>
          </div>
          <button class="btn primary" id="make-prompt">프롬프트</button>
        </div>

        <textarea id="request" class="request" placeholder="예: 할 일 관리 앱"></textarea>

        <div class="card">
          <div class="card-head">
            <span>프롬프트</span>
            <button class="btn primary" id="approve" disabled>승인</button>
          </div>
          <div id="prompt" class="prompt empty">생성된 프롬프트가 여기에 표시됩니다.</div>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="panel" id="preview">
        <div class="row head-row">
          <div>
            <div class="eyebrow">미리보기</div>
            <h1>결과</h1>
          </div>
          <div class="inline-actions">
            <label class="btn ghost upload-box">
              + 이미지
              <input id="image" type="file" accept="image/*">
            </label>
            <button class="btn ghost" id="capture">캡처</button>
          </div>
        </div>

        <div id="app-preview" class="preview-box">
          <div class="empty-preview">앱 미리보기가 여기에 표시됩니다.</div>
        </div>

        <div class="card modify-card">
          <div id="attachment" class="attachment hidden"></div>
          <div class="modifier-row">
            <textarea id="change" rows="2" placeholder="수정 내용을 입력하세요"></textarea>
            <div class="modifier-actions">
              <button class="btn ghost" id="clear">초기화</button>
              <button class="btn primary" id="send-change">적용</button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel" id="versions">
        <div class="row head-row">
          <div>
            <div class="eyebrow">기록</div>
            <h1>버전</h1>
          </div>
        </div>
        <div id="version-list" class="version-list"></div>
      </section>
    </main>
  </div>

  <dialog id="confirm-dialog">
    <div class="dialog-box">
      <div class="eyebrow">검토</div>
      <h2>이 프롬프트로 진행할까요?</h2>
      <pre id="dialog-prompt"></pre>
      <div class="dialog-actions">
        <button class="btn ghost" id="cancel">취소</button>
        <button class="btn primary" id="confirm">승인</button>
      </div>
    </div>
  </dialog>
</body>
</html>
